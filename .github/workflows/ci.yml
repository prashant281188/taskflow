name: taskflow_ci_pipeline
run-name: tackflow_ci_pipeline

on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Test api & web
        run: |
          cd api && npm ci && npm test --if-present
          cd web && npm ci && npm test --if-present
  build-and-push:
    needs: test
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}
      - name: Build and push api and web images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/taskflow:{{github.sha}}
          cache-from: type=gha
          cache-to: type=gha, mode=max
