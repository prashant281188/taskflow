name: CI Pipeline - Taskflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-applications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Point the cache manager to the actual locations of your lock files
          cache-dependency-path: |
            taskflow/api/package-lock.json
            taskflow/web/package-lock.json

      - name: Test API & Web
        run: |
          cd taskflow/api && npm ci && npm test --if-present
          cd ../web && npm ci && npm test --if-present

  build-api:
    needs: test-applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: test-applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./taskflow/web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
