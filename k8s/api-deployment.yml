apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskflow-app
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: prashant281188/taskflow-api:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://taskapp:admin@localhost:5432/taskdb"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 3000
