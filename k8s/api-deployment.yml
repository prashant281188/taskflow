apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: prashant281188/taskflow-api:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: PORT
              value: "3000"
            - name: CORS_ORIGIN
              value: "http://localhost:3001" # Set for local browser access
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://taskapp:$(POSTGRES_PASSWORD)@db.default.svc.cluster.local:5432/taskdb"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow-app
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---