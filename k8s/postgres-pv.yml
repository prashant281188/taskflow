apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: taskflow-app
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/disks/postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - api
