apiVersion: v1
kind: PersistentVolume
metadata:
  name: taskflow-pgdata-pv
  namespace: taskflow-app
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/taskflow/postgres-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskflow-pgdata
  namespace: taskflow-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---