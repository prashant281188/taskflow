apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskflow-app
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: prashant281188/taskflow-web:latest
          env:
          - name: API_BACKEND_URL
            value: http://api:3000
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
          ports:
            - containerPort: 3001
