apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: prashant281188/taskflow-web:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_BACKEND_URL
              value: "http://api.default.svc.cluster.local:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: taskflow-app
spec:
  selector:
    app: web
  ports:
    - port: 3001
      targetPort: 3001
  type: LoadBalancer
